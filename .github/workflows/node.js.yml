name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# 最小权限：CI 只读仓库内容
permissions:
  contents: read

# 同一分支的新提交取消旧任务，避免排队浪费
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # 部署要求 Node >= 20，Dockerfile 与后端推荐 22
        node-version: [ "20.x", "22.x" ]

    steps:
      - name: 拉取代码
        uses: actions/checkout@v5

      - name: 配置 Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          # 三个子项目各自有 lockfile，共用缓存配置
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
            server/package-lock.json

      # ---------- 管理端（Vue 3 + Vite + Element Plus） ----------
      - name: 管理端 - 安装依赖
        run: npm ci

      - name: 管理端 - 生产构建
        run: npm run build

      # ---------- 移动端（uni-app，构建 H5 产物） ----------
      - name: 移动端 - 安装依赖
        working-directory: mobile
        run: npm ci

      - name: 移动端 - 构建 H5
        working-directory: mobile
        run: npm run build:h5

      # ---------- 后端（Express，无构建步骤，仅校验依赖可安装） ----------
      - name: 后端 - 安装依赖
        working-directory: server
        run: npm ci
